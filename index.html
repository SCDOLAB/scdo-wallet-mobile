<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SCDO Wallet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B0E11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:16px;max-width:480px;margin:0 auto;min-height:100vh}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#4CAF50,#2E7D32);text-align:center;line-height:56px;font-size:28px;margin:20px auto 8px;font-weight:700}
h1{text-align:center;font-size:20px;margin-bottom:4px}
.sub{text-align:center;color:#666;font-size:12px;margin-bottom:24px}
.card{background:#1A1D24;border-radius:16px;padding:20px;margin-bottom:12px}
.bal-label{color:#888;font-size:12px;margin-bottom:4px}
.bal{font-size:32px;font-weight:700;letter-spacing:-0.5px}
.bal-sub{color:#666;font-size:12px;margin-top:4px}
.addr{background:#12151B;border-radius:10px;padding:10px 12px;font-size:11px;word-break:break-all;color:#4CAF50;margin-top:10px;font-family:monospace;line-height:1.5}
.btn{background:#4CAF50;color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:600;width:100%;margin-top:10px;cursor:pointer}
.btn:active{opacity:0.8}
.btn2{background:#1A1D24;border:1px solid #2A2D34;color:#fff}
.btn3{background:transparent;border:none;color:#4CAF50;padding:10px;cursor:pointer;font-size:14px}
input{background:#12151B;border:1px solid #2A2D34;color:#fff;padding:14px;border-radius:12px;font-size:15px;width:100%;margin-bottom:10px;outline:none}
input:focus{border-color:#4CAF50}
.hidden{display:none}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1A1D24;border:1px solid #4CAF50;color:#4CAF50;padding:12px 24px;border-radius:12px;font-size:14px;z-index:9999;display:none;max-width:90%;text-align:center}
.nav{display:flex;gap:8px;margin-bottom:16px}
.nav button{flex:1;background:#1A1D24;border:1px solid #2A2D34;color:#888;padding:12px;border-radius:12px;cursor:pointer;font-size:13px}
.nav button.active{background:#4CAF50;color:#fff;border-color:#4CAF50;font-weight:600}
.qr-box{background:#fff;border-radius:16px;padding:20px;margin:16px auto;max-width:260px;text-align:center}
.qr-box canvas{display:block;margin:0 auto}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1E2128}
.tx-item:last-child{border-bottom:none}
.tx-dir{font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600}
.tx-in{background:#1B3A1D;color:#4CAF50}
.tx-out{background:#3A1B1B;color:#ff6b6b}
.tx-addr{font-size:11px;color:#888;font-family:monospace;word-break:break-all;max-width:180px}
.tx-amt{font-size:14px;font-weight:600;text-align:right}
.tx-time{font-size:10px;color:#555;margin-top:2px}
.scan-btn{display:inline-flex;align-items:center;gap:4px;background:#12151B;border:1px solid #2A2D34;color:#888;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:10px}
.copy-btn{color:#4CAF50;cursor:pointer;font-size:12px;margin-left:8px}
.section-title{font-size:14px;font-weight:600;margin-bottom:12px;color:#ccc}
.hidden-cam{display:none}
</style>
</head>
<body>
<div id="toast"></div>
<script>
function toast(msg,color){var t=document.getElementById('toast');t.textContent=msg;t.style.borderColor=color||'#4CAF50';t.style.color=color||'#4CAF50';t.style.display='block';setTimeout(function(){t.style.display='none';},3000);}
window.alert=function(m){toast(String(m), m.indexOf('Error')>=0||m.indexOf('error')>=0?'#ff6b6b':'#4CAF50');};
</script>

<!-- Welcome -->
<div id="s-welcome">
  <div class="logo">S</div>
  <h1>SCDO Wallet</h1>
  <p class="sub">Secure · Fast · Decentralized</p>
  <div class="card">
    <button class="btn" id="btn-create">Create New Wallet</button>
    <button class="btn btn2" id="btn-import-show">Import Existing</button>
  </div>
</div>

<!-- Import -->
<div id="s-import" class="hidden">
  <div class="logo">S</div>
  <h1>Import Wallet</h1>
  <div class="card">
    <input type="text" id="priv-in" placeholder="Private key (0x...)">
    <button class="btn" id="btn-import">Import</button>
    <button class="btn btn2" onclick="show('s-welcome')">Back</button>
  </div>
</div>

<!-- Main Home -->
<div id="s-home" class="hidden">
  <div class="card" style="text-align:center">
    <div class="bal-label">Total Balance</div>
    <div class="bal" id="bal">0.00000000</div>
    <div class="bal-sub">SCDO</div>
    <div class="addr" id="addr" style="text-align:center"></div>
  </div>

  <div class="nav">
    <button class="active" data-tab="send" onclick="switchTab('send')">Send</button>
    <button data-tab="receive" onclick="switchTab('receive')">Receive</button>
    <button data-tab="history" onclick="switchTab('history')">History</button>
  </div>

  <!-- Send Tab -->
  <div id="tab-send" class="card">
    <div class="section-title">Send</div>
    <div class="scan-btn" onclick="startScan()">📷 Scan QR</div>
    <input type="text" id="to" placeholder="To address (1S...)">
    <input type="number" id="amt" placeholder="Amount (SCDO)" step="0.00000001">
    <button class="btn" id="btn-send">Send</button>
  </div>

  <!-- Receive Tab -->
  <div id="tab-receive" class="card hidden">
    <div class="section-title" style="text-align:center">Receive</div>
    <div class="qr-box">
      <div id="qr-canvas"></div>
    </div>
    <div class="addr" id="addr2" style="text-align:center"></div>
    <button class="btn btn2" onclick="copyAddr()">Copy Address</button>
  </div>

  <!-- History Tab -->
  <div id="tab-history" class="card hidden">
    <div class="section-title">Transaction History</div>
    <div id="tx-list"><p style="color:#555;font-size:13px;text-align:center;padding:20px 0">No transactions yet</p></div>
  </div>

  <div class="nav">
    <button class="btn3" id="btn-backup" style="flex:1">Backup Key</button>
  </div>
</div>

<!-- Backup -->
<div id="s-backup" class="hidden">
  <div class="logo">S</div>
  <h1>Backup</h1>
  <div class="card">
    <p style="color:#ff6b6b;font-size:13px;margin-bottom:12px">⚠ Write down your private key. Anyone with it controls your funds.</p>
    <div class="addr" id="pk"></div>
    <button class="btn" id="btn-done">I've Saved It</button>
    <button class="btn btn2" onclick="goHome()">Back</button>
  </div>
</div>

<!-- Camera Scanner -->
<div id="cam-overlay" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:1000">
  <video id="cam" style="width:100%;height:100%;object-fit:cover" autoplay></video>
  <div style="position:absolute;bottom:40px;left:0;right:0;text-align:center">
    <button class="btn btn2" onclick="stopScan()" style="width:auto;padding:12px 32px">Cancel</button>
  </div>
</div>

<script type="module">
try {
  function sha256(bytes){
    const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
    function rotr(x,n){return(x>>>n)|(x<<(32-n));}
    let bitLen=bytes.length*8;let padded=new Uint8Array(((bytes.length+9+63)>>6)<<6);padded.set(bytes);padded[bytes.length]=0x80;
    for(let i=0;i<8;i++)padded[padded.length-1-i]=(bitLen>>(i*8))&0xff;
    let H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    for(let chunk=0;chunk<padded.length;chunk+=64){
      let w=new Uint32Array(64);for(let i=0;i<16;i++)w[i]=(padded[chunk+i*4]<<24)|(padded[chunk+i*4+1]<<16)|(padded[chunk+i*4+2]<<8)|padded[chunk+i*4+3];
      for(let i=16;i<64;i++){let s0=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3),s1=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
      let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(let i=0;i<64;i++){let S1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
      H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
    }
    let out=new Uint8Array(32);for(let i=0;i<8;i++){out[i*4]=(H[i]>>>24)&0xff;out[i*4+1]=(H[i]>>>16)&0xff;out[i*4+2]=(H[i]>>>8)&0xff;out[i*4+3]=H[i]&0xff;}
    return out;
  }
  function hmacSha256Sync(key,...datas){let total=datas.reduce((a,d)=>a+d.length,0);let msg=new Uint8Array(total);let off=0;datas.forEach(d=>{msg.set(d,off);off+=d.length;});if(key.length>64)key=sha256(key);let k=new Uint8Array(64);k.set(key);let ipad=new Uint8Array(64),opad=new Uint8Array(64);for(let i=0;i<64;i++){ipad[i]=k[i]^0x36;opad[i]=k[i]^0x5c;}let inner=new Uint8Array(64+msg.length);inner.set(ipad);inner.set(msg,64);let ih=sha256(inner);let outer=new Uint8Array(64+32);outer.set(opad);outer.set(ih,64);return sha256(outer);}

  const secp = await import('/lib/secp.mjs');
  secp.utils.hmacSha256Sync = hmacSha256Sync;
  secp.utils.sha256Sync = sha256;
  const sha3mod = await import('/lib/sha3.mjs');
  const keccak_256 = sha3mod.default.keccak_256;

  const RPC = {1:'http://192.168.50.50:8037',2:'http://192.168.50.50:8038',3:'http://192.168.50.50:8039',4:'http://192.168.50.50:8036'};
  let wallet = null;

  function h2b(hex){hex=hex.replace('0x','');if(hex.length%2)hex='0'+hex;const r=new Uint8Array(hex.length/2);for(let i=0;i<r.length;i++)r[i]=parseInt(hex.substr(i*2,2),16);return r;}
  function b2h(b){return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');}
  function n2b(n){if(!n)return new Uint8Array(0);let h=n.toString(16);if(h.length%2)h='0'+h;return h2b(h);}
  function cat(){let t=0;for(let i=0;i<arguments.length;i++)t+=arguments[i].length;const r=new Uint8Array(t);let o=0;for(let i=0;i<arguments.length;i++){r.set(arguments[i],o);o+=arguments[i].length;}return r;}
  function encLen(off,len){if(len<56)return new Uint8Array([off+len]);const lb=n2b(len);const r=new Uint8Array(lb.length+1);r[0]=off+55+lb.length;r.set(lb,1);return r;}
  function rlp(e){if(e==null)return new Uint8Array(0);if(typeof e==='number')return rlp(n2b(e));if(typeof e==='string'){if(e.startsWith('0x'))return rlp(h2b(e));return rlp(new TextEncoder().encode(e));}if(e instanceof Uint8Array){if(e.length===1&&e[0]<0x80)return e;return cat(encLen(0x80,e.length),e);}if(Array.isArray(e)){const p=cat.apply(null,e.map(rlp));return cat(encLen(0xc0,p.length),p);}return new Uint8Array(0);}

  function derive(privHex,shard=1){
    const priv=h2b(privHex);const pub=secp.getPublicKey(priv,false);const pubRaw=pub.slice(1);
    const rlpPub=cat(new Uint8Array([0xb8,0x40]),pubRaw);const hashHex=keccak_256(rlpPub);
    const addr=h2b(hashHex).slice(-20);addr[0]=shard;addr[19]=(addr[19]&0xF0)|1;
    const onChain='0x'+b2h(addr);const detShard=parseInt(onChain.substring(3,4));
    return{privKey:privHex.startsWith('0x')?privHex:'0x'+privHex,onChain:onChain,human:detShard+'S'+b2h(addr),shard:detShard};
  }

  function show(id){['s-welcome','s-import','s-home','s-backup'].forEach(s=>document.getElementById(s).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');}

  window.switchTab=function(tab){
    ['send','receive','history'].forEach(t=>{document.getElementById('tab-'+t).classList.add('hidden');});
    document.getElementById('tab-'+tab).classList.remove('hidden');
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    if(tab==='history') loadHistory();
  };
  window.copyAddr=function(){
    const addr=wallet.human;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(addr).then(()=>toast('Copied!')).catch(()=>fallbackCopy(addr));
    } else {
      fallbackCopy(addr);
    }
  };
  function fallbackCopy(text){
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');toast('Copied!');}catch(e){toast('Copy failed: '+text);}
    document.body.removeChild(ta);
  }

  function loadBalance(){
    fetch(RPC[wallet.shard],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'scdo_getBalance',params:[wallet.onChain,'',-1]})})
    .then(r=>r.json()).then(r=>{
      if(r.result&&r.result.Balance!==undefined){
        document.getElementById('bal').textContent=(parseInt(r.result.Balance)/1e8).toFixed(8);
      }
    }).catch(()=>{});
  }

  // QR Code generator (compact)
  function drawQR(text){
    const size=200;
    const cells=25;
    const c=document.createElement('canvas');c.width=size;c.height=size;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000';
    // Simple QR pattern - just show address as text in center for now
    // Real QR requires encoding, use Google Chart API as fallback
    const qrUrl='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(text);
    const img=document.createElement('img');img.src=qrUrl;img.width=size;img.height=size;
    img.onload=()=>{document.getElementById('qr-canvas').innerHTML='';document.getElementById('qr-canvas').appendChild(img);};
    img.onerror=()=>{
      // Fallback: draw placeholder
      ctx.fillStyle='#000';
      for(let y=0;y<cells;y++)for(let x=0;x<cells;x++){
        if(Math.random()>0.5||(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17)){
          ctx.fillRect(x*8,y*8,8,8);
        }
      }
      document.getElementById('qr-canvas').innerHTML='';document.getElementById('qr-canvas').appendChild(c);
    };
  }

  function copyAddr(){navigator.clipboard.writeText(wallet.human).then(()=>toast('Copied!'));}

  // Transaction history (local)
  function saveTx(tx){
    let hist=JSON.parse(localStorage.getItem('scdo_tx_hist')||'[]');
    hist.unshift(tx);localStorage.setItem('scdo_tx_hist',JSON.stringify(hist.slice(0,50)));
  }
  async function loadHistory(){
    const el=document.getElementById('tx-list');
    el.innerHTML='<p style="color:#555;font-size:13px;text-align:center;padding:20px 0">Scanning blocks...</p>';
    const myAddr=wallet.human;
    const found=[];
    try{
      const hRes=await fetch(RPC[1],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'scdo_getBlockHeight',params:[]})}).then(r=>r.json());
      const curHeight=hRes.result||9237739;
      for(let h=curHeight;h>curHeight-50;h--){
        try{
          const bRes=await fetch(RPC[1],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'scdo_getBlock',params:["",h,true]})}).then(r=>r.json());
          if(!bRes.result||!bRes.result.transactions)continue;
          const ts=bRes.result.header.CreateTimestamp*1000;
          for(const tx of bRes.result.transactions){
            if(tx.from===myAddr||tx.to===myAddr){
              const dir=tx.to===myAddr?'IN':'OUT';
              found.push({dir,other:dir==='IN'?tx.from:tx.to,amount:(tx.amount/1e8).toFixed(8),time:ts,hash:tx.hash||''});
            }
          }
        }catch(e){}
      }
    }catch(e){}
    const localHist=JSON.parse(localStorage.getItem('scdo_tx_hist')||'[]');
    localHist.forEach(t=>{
      const dir=t.to===myAddr?'IN':'OUT';
      found.push({dir,other:dir==='IN'?t.from:t.to,amount:t.amount,time:t.time,hash:t.hash||''});
    });
    if(!found.length){el.innerHTML='<p style="color:#555;font-size:13px;text-align:center;padding:20px 0">No transactions found</p>';return;}
    found.sort((a,b)=>b.time-a.time);
    el.innerHTML=found.map(t=>{
      const color=t.dir==='IN'?'#4CAF50':'#ff6b6b';
      return `<div class="tx-item">
        <div><span class="tx-dir ${t.dir==='IN'?'tx-in':'tx-out'}">${t.dir}</span>
        <div class="tx-addr" style="margin-top:4px">${t.other.substring(0,24)}...</div>
        <div class="tx-time">${new Date(t.time).toLocaleString()}</div></div>
        <div class="tx-amt" style="color:${color}">${t.dir==='IN'?'+':'-'}${t.amount} SCDO</div>
      </div>`;
    }).join('');
  }

  // Camera scan
  let stream=null;
  window.startScan=async function(){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      document.getElementById('cam-overlay').classList.remove('hidden');
      document.getElementById('cam').srcObject=stream;
      // Try BarcodeDetector
      if('BarcodeDetector' in window){
        const bd=new BarcodeDetector({formats:['qr_code']});
        async function detect(){
          if(!stream)return;
          try{
            const codes=await bd.detect(document.getElementById('cam'));
            if(codes.length){
              const val=codes[0].rawValue;
              document.getElementById('to').value=val;
              stopScan();toast('Address scanned!');
            }
          }catch(e){}
          requestAnimationFrame(detect);
        }
        detect();
      } else {
        toast('Camera API not supported, please enter address manually');
        stopScan();
      }
    }catch(e){toast('Camera error: '+e.message);}
  };
  window.stopScan=function(){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    document.getElementById('cam-overlay').classList.add('hidden');
  };

  function goHome(){
    document.getElementById('addr').textContent=wallet.human;
    document.getElementById('addr2').textContent=wallet.human;
    document.getElementById('pk').textContent=wallet.privKey;
    drawQR(wallet.human);
    show('s-home');loadBalance();
  }

  document.getElementById('btn-create').onclick=function(){
    try{
      const priv=secp.utils.randomPrivateKey();
      wallet=derive(b2h(priv),1);
      localStorage.setItem('scdo_priv_v3',wallet.privKey);
      goHome();
    }catch(e){toast('Error: '+e.message,'#ff6b6b');}
  };

  document.getElementById('btn-import-show').onclick=()=>show('s-import');
  document.getElementById('btn-import').onclick=function(){
    wallet=derive(document.getElementById('priv-in').value.trim(),1);
    localStorage.setItem('scdo_priv_v3',wallet.privKey);
    goHome();
  };
  document.getElementById('btn-backup').onclick=()=>show('s-backup');
  document.getElementById('btn-done').onclick=goHome;

  document.getElementById('btn-send').onclick=function(){
    const to=document.getElementById('to').value.trim();
    const amt=parseFloat(document.getElementById('amt').value);
    if(!to||!amt){alert('Fill all fields');return;}
    const toOnChain='0x'+to.substring(to.indexOf('S')+1);
    fetch(RPC[wallet.shard],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'scdo_getAccountNonce',params:[wallet.onChain,'',-1]})})
    .then(r=>r.json()).then(r=>{
      if(r.error)throw new Error(r.error.message);
      const nonce=(r.result||0)+1;
      const list=[0,wallet.onChain,toOnChain,Math.floor(amt*1e8),nonce,1,21000,0,'0x'];
      const enc=rlp(list);const hh=keccak_256(new Uint8Array(enc));
      const sig=secp.signSync(h2b(hh),h2b(wallet.privKey),{recovered:true,der:false});
      const sb=new Uint8Array(sig[0].length+1);sb.set(sig[0]);sb[sb.length-1]=sig[1];
      let bin='';for(let i=0;i<sb.length;i++)bin+=String.fromCharCode(sb[i]);
      return fetch(RPC[wallet.shard],{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'scdo_addTx',params:[{Data:{Type:0,From:wallet.onChain,To:toOnChain,Amount:Math.floor(amt*1e8),AccountNonce:nonce,GasPrice:1,GasLimit:21000,Timestamp:0,Payload:'0x'},Hash:'0x'+hh,Signature:{Sig:btoa(bin),Pubkey:''}}]})}).then(r=>r.json());
    }).then(r=>{
      if(r.error)throw new Error(r.error.message);
      saveTx({to:to,from:wallet.human,amount:amt,time:Date.now(),hash:r.result||''});
      alert('Sent!');loadBalance();
    }).catch(e=>alert('Error: '+e.message));
  };

  const saved=localStorage.getItem('scdo_priv_v3');
  if(saved){wallet=derive(saved,1);goHome();}
}catch(e){toast('Fatal: '+e.message,'#ff6b6b');}
</script>
